[package]
name = "orch-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
orch-core = { path = "../orch-core" }
orch-host = { path = "../orch-host" }
orch-system = { path = "../orch-system" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order", "arbitrary_precision"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "modern_sqlite"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "io-util", "sync", "time"] }
axum = "=0.8.9"
uuid = { version = "=1.22.0", features = ["v4"] }
chrono = "=0.4.45"
sha2 = "=0.11.0"
sha1 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
base64 = "0.22"
libc = "=0.2.191"
regex = "1"
fancy-regex = "0.14"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
